# Monthly refresh of the bundled OSRS Wiki drop data.
#
# Runs scripts/generate_drop_rates.py in full, non-interactive mode. The script only rewrites
# src/main/resources/drop_rates.json when the drop data actually changed, so a run with no
# changes ends cleanly with no commit. When the file did change, the data is pushed to the
# `data-refresh` branch and a pull request is opened (or an existing one updated) for review.
#
# Submitting the new version to the RuneLite plugin hub is deliberately NOT automated.
#
# Requirements (repo Settings > Actions > General > Workflow permissions):
#   - "Allow GitHub Actions to create and approve pull requests" must be enabled, otherwise
#     `gh pr create` fails with "GitHub Actions is not permitted to create or approve pull requests".
# Note: GitHub disables scheduled workflows on public repos after 60 days without repository
# activity. Re-enable from the Actions tab if that happens, or trigger it manually.

name: Refresh drop data

on:
  schedule:
    - cron: "17 6 1 * *" # 06:17 UTC on the 1st of every month
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-drop-data
  cancel-in-progress: false

env:
  DATA_FILE: src/main/resources/drop_rates.json
  BRANCH: data-refresh

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --quiet requests

      - name: Generate drop data
        # Exits non-zero (and leaves the data file untouched) if any wiki request fails or the
        # result is empty/partial. Prints the change summary to stdout.
        run: |
          python scripts/generate_drop_rates.py --full --non-interactive \
            -o "$DATA_FILE" --summary-file "$RUNNER_TEMP/summary.md"

      - name: Detect changes
        id: changes
        run: |
          if git diff --quiet -- "$DATA_FILE"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No drop data changes."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Drop data changed."
          fi

      - name: Commit and push to data-refresh branch
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add "$DATA_FILE"
          git commit -m "Refresh drop rate data ($(date -u +%Y-%m-%d))"
          # The branch is always rebuilt from the default branch, so a force push is safe and
          # keeps an already-open PR pointing at a single fresh commit.
          git push --force origin "$BRANCH"

      - name: Open or update pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          title="Refresh drop rate data ($(date -u +%Y-%m-%d))"
          body="$RUNNER_TEMP/pr-body.md"
          {
            echo "Automated monthly refresh of the bundled OSRS Wiki drop data."
            echo
            cat "$RUNNER_TEMP/summary.md"
            echo
            echo "_Generated by the [refresh-drop-data workflow](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}). Review, merge, then submit the plugin-hub update manually._"
          } > "$body"

          existing=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --base "$BASE" \
            --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --repo "$GITHUB_REPOSITORY" --title "$title" --body-file "$body"
            echo "Updated existing PR #$existing"
          else
            gh pr create --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --base "$BASE" \
              --title "$title" --body-file "$body"
          fi
