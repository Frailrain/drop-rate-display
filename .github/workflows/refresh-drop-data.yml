# Monthly refresh of the bundled OSRS Wiki drop data.
#
# Runs scripts/generate_drop_rates.py in full, non-interactive mode. The script only rewrites
# src/main/resources/drop_rates.json when the drop data actually changed, so a run with no
# changes ends cleanly with no commit. When the file did change, the new data is committed
# straight to the default branch with the change summary in the commit message, and the same
# summary is shown on the run's summary page in the Actions tab.
#
# Submitting the new version to the RuneLite plugin hub is deliberately NOT automated.
#
# Only the default GITHUB_TOKEN with `contents: write` is needed. If branch protection is ever
# enabled on the default branch, the push will be rejected unless Actions is allowed to bypass it.
# Note: GitHub disables scheduled workflows on public repos after 60 days without repository
# activity. Re-enable from the Actions tab if that happens, or trigger it manually.

name: Refresh drop data

on:
  schedule:
    - cron: "17 6 1 * *" # 06:17 UTC on the 1st of every month
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-drop-data
  cancel-in-progress: false

env:
  DATA_FILE: src/main/resources/drop_rates.json

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --quiet requests

      - name: Generate drop data
        # Exits non-zero (and leaves the data file untouched) if any wiki request fails or the
        # result is empty/partial. Prints the change summary to stdout.
        run: |
          python scripts/generate_drop_rates.py --full --non-interactive \
            -o "$DATA_FILE" --summary-file "$RUNNER_TEMP/summary.md"

      - name: Publish run summary
        run: cat "$RUNNER_TEMP/summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Detect changes
        id: changes
        run: |
          if git diff --quiet -- "$DATA_FILE"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No drop data changes."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Drop data changed."
          fi

      - name: Commit and push to the default branch
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DATA_FILE"
          {
            echo "Refresh drop rate data ($(date -u +%Y-%m-%d))"
            echo
            echo "Automated monthly refresh of the bundled OSRS Wiki drop data."
            echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            cat "$RUNNER_TEMP/summary.md"
          } | git commit -q -F -
          git push origin HEAD:"${{ github.event.repository.default_branch }}"
          echo "Pushed $(git rev-parse --short HEAD) to ${{ github.event.repository.default_branch }}."
